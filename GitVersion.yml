calculation:
  mode: ContinuousDelivery
  tag-prefix: 'v'

  branches:
    main:
      regex: ^(master|main)$
      label: alpha
      increment: Patch
    release:
      label: alpha
      prevent-increment:
        when-current-commit-tagged: true

  ignore:
    sha: []

output:
  assembly-versioning-scheme: MajorMinorPatch
