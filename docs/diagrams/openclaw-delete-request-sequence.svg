<svg xmlns="http://www.w3.org/2000/svg" width="1945" height="1660" viewBox="0 0 1945 1660" role="img" aria-labelledby="title desc">
  <title id="title">Delete request sequence</title>
  <desc id="desc">Sequence from user request through gateway routing, conditional gateway approval, node invoke gates, Windows local approval and sandbox, and final result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker>
    <style>
      .title{font:700 30px Segoe UI,Arial,sans-serif;fill:#111}
      .subtitle{font:17px Segoe UI,Arial,sans-serif;fill:#222}
      .participant{font:17px Segoe UI,Arial,sans-serif;fill:#111;text-anchor:middle}
      .msg{font:14px Segoe UI,Arial,sans-serif;fill:#111;text-anchor:middle}
      .note{font:14px Segoe UI,Arial,sans-serif;fill:#111}
      .frame{font:700 15px Segoe UI,Arial,sans-serif;fill:#111}
    </style>
  </defs>
  <rect width="1945" height="1660" fill="#fff"/>
  <text x="40" y="50" class="title">Delete request sequence: routing, approval, execution, result</text>
  <text x="40" y="92" class="subtitle">The host=node path is shown in full. Typed gateway and workspace operations exit earlier without entering node execution.</text>

  <rect x="40" y="140" width="150" height="65" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="115" y="180" class="participant">User</text>
  <rect x="245" y="140" width="180" height="65" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="335" y="180" class="participant">Operator surface</text>
  <rect x="480" y="140" width="190" height="65" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="575" y="180" class="participant">Gateway agent</text>
  <rect x="725" y="140" width="190" height="65" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="820" y="180" class="participant">Gateway control</text>
  <rect x="970" y="140" width="190" height="65" rx="12" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="1065" y="180" class="participant">Exec host policy</text>
  <rect x="1215" y="140" width="190" height="65" rx="12" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/><text x="1310" y="180" class="participant">Node router</text>
  <rect x="1460" y="140" width="190" height="65" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="1555" y="180" class="participant">Windows node</text>
  <rect x="1705" y="140" width="200" height="65" rx="12" fill="#99E9F2" stroke="#0C8599" stroke-width="2"/><text x="1805" y="180" class="participant">V2 + MXC/process</text>

  <g stroke="#868E96" stroke-width="1" stroke-dasharray="8 7">
    <line x1="115" y1="205" x2="115" y2="1620"/><line x1="335" y1="205" x2="335" y2="1620"/>
    <line x1="575" y1="205" x2="575" y2="1620"/><line x1="820" y1="205" x2="820" y2="1620"/>
    <line x1="1065" y1="205" x2="1065" y2="1620"/><line x1="1310" y1="205" x2="1310" y2="1620"/>
    <line x1="1555" y1="205" x2="1555" y2="1620"/><line x1="1805" y1="205" x2="1805" y2="1620"/>
  </g>

  <path d="M115 260 H335" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="248" class="msg">"delete this"</text>
  <path d="M335 320 H575" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/><text x="455" y="308" class="msg">chat/session turn</text>
  <path d="M575 365 V430" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="382" class="note"><tspan x="600">resolve target authority</tspan><tspan x="600" dy="20">choose typed tool or exec host</tspan></text>

  <rect x="500" y="475" width="490" height="205" rx="10" fill="none" stroke="#5C2D91" stroke-width="2"/>
  <text x="515" y="500" class="frame">Earlier exits for non-node targets</text>
  <path d="M575 545 H820" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="533" class="msg">typed RPC: sessions.delete</text>
  <path d="M820 590 H575" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="612" class="msg">authorized result</text>
  <path d="M575 645 H820" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="633" class="msg">filesystem tool + workspace policy</text>

  <path d="M575 740 H820" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="728" class="msg">resolve paired target node</text>
  <path d="M575 805 H1065" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/><text x="820" y="793" class="msg">requested policy + host policy -> stricter result</text>

  <rect x="950" y="840" width="725" height="260" rx="10" fill="none" stroke="#F7630C" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="965" y="865" class="frame">Optional gateway approval path (skipped by full + off)</text>
  <path d="M1065 915 H1310" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/><text x="1187" y="903" class="msg">system.run.prepare</text>
  <path d="M1310 960 H1555" fill="none" stroke="#D13438" stroke-width="2" marker-end="url(#arrow)"/><text x="1432" y="948" class="msg">forward prepare</text>
  <path d="M1555 1005 H1065" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/><text x="1310" y="1027" class="msg">canonical plan</text>
  <path d="M1065 1060 H335" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="1048" class="msg">gateway approval request</text>
  <path d="M335 1090 H1065" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="1112" class="msg">allow or deny</text>

  <path d="M575 1150 H1310" fill="none" stroke="#D13438" stroke-width="3" marker-end="url(#arrow)"/><text x="942" y="1138" class="msg">node.invoke system.run + canonical argv</text>
  <path d="M1310 1195 V1250" fill="none" stroke="#D13438" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1335" y="1205" class="note"><tspan x="1335">pairing + declared command</tspan><tspan x="1335" dy="20">allow/deny + plugin policy</tspan></text>
  <path d="M1310 1280 H1555" fill="none" stroke="#D13438" stroke-width="3" marker-end="url(#arrow)"/><text x="1432" y="1268" class="msg">forward system.run</text>
  <path d="M1555 1330 H1805" fill="none" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/><text x="1680" y="1318" class="msg">Windows V2 live policy</text>
  <path d="M1805 1370 V1440" fill="none" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1780" y="1385" class="note" text-anchor="end"><tspan x="1780">prompt if needed; revalidate</tspan><tspan x="1780" dy="20">MXC, strict deny, or host fallback</tspan></text>
  <path d="M1805 1480 H575" fill="none" stroke="#107C10" stroke-width="3" marker-end="url(#arrow)"/><text x="1190" y="1468" class="msg">stdout/stderr/exit/diagnostic -> gateway -> agent</text>
  <path d="M575 1540 H335" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/><text x="455" y="1528" class="msg">report actual outcome</text>
  <path d="M335 1590 H115" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="1578" class="msg">success, denial, or failure</text>
</svg>
