name: Inbox ProcDump help candidates (no capture)
on:
  push:
    branches: [validation/inbox-stack-ab3cbe7b-20261108]
    paths:
      - .github/workflows/inbox-procdump-help-candidates.yml
      - scripts/pr-ci-procdump-help-candidates/**
      - scripts/pr-ci-procdump-help-format/**
      - scripts/pr-ci-capture-preparation/**
      - scripts/pr-ci-observe-only/**
permissions:
  contents: read
concurrency:
  group: inbox-pr-observe-only-ab3cbe7b
  cancel-in-progress: false
jobs:
  help-candidates:
    if: github.repository == 'openclaw/openclaw-windows-node'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed pipeline
        uses: actions/checkout@v7
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout exact failed product
        uses: actions/checkout@v7
        with:
          ref: e56258fd0a835969b417f8d0236baf86760e3139
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged semantics and new finite projection
        run: |
          python pipeline/scripts/pr-ci-capture-preparation/test_procdump_help.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pipeline/scripts/pr-ci-procdump-help-format/test_format.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pipeline/scripts/pr-ci-procdump-help-candidates/test_candidates.py
          exit $LASTEXITCODE
      - name: Observe one pinned no-target help response
        timeout-minutes: 35
        run: |
          ./pipeline/scripts/pr-ci-procdump-help-candidates/Invoke-ToolHelpCandidates.ps1 -ProductRoot "$env:GITHUB_WORKSPACE/product" -PipelineRoot "$env:GITHUB_WORKSPACE/pipeline"
          exit $LASTEXITCODE
      - name: Join and clean private invocation
        if: always()
        run: |
          ./pipeline/scripts/pr-ci-procdump-help-candidates/Invoke-ToolHelpCandidates.ps1 -ProductRoot "$env:GITHUB_WORKSPACE/product" -PipelineRoot "$env:GITHUB_WORKSPACE/pipeline" -CleanupOnly
          exit $LASTEXITCODE
      - name: Validate exact safe observation
        id: safe
        if: always()
        run: |
          python pipeline/scripts/pr-ci-procdump-help-candidates/validate_candidates.py --check tool-help-candidates-safe/safe-report.json
          exit $LASTEXITCODE
      - name: Upload only validated JSON
        if: always() && steps.safe.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: inbox-procdump-help-candidates
          path: tool-help-candidates-safe/safe-report.json
          if-no-files-found: error
          retention-days: 7
