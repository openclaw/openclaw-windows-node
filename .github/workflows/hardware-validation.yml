name: Windows hardware validation
# TEMPORARY overlay of the already registered workflow, only on the owned branch.
# Two isolated case executions, not a full UI retry or hardware/WSL proof.
on:
  workflow_dispatch:
    inputs:
      pipeline_sha:
        description: Exact reviewed temporary pipeline commit (must equal dispatch SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-hardware-validation
  cancel-in-progress: false
jobs:
  focused-voice-pair:
    if: >-
      github.repository == 'openclaw/openclaw-windows-node' &&
      github.ref == 'refs/heads/validation/inbox-stack-ab3cbe7b-20261108' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      inputs.pipeline_sha == github.sha
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GitVersion_NoNormalizeEnabled: 'true'
      GitVersion_NoFetchEnabled: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      OPENCLAW_CI_COLLECT_COVERAGE: 'false'
      EXPECTED_PIPELINE_SHA: ${{ inputs.pipeline_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pipeline_sha }}
          path: pipeline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1c223f14f6b66cf0928eeb8686f34208b5ea4d51
          path: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1e60d1135ae50d3a37525c7cdc3433b81123b4f3
          path: approval
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Validate curator, build both pins and prepare existing CI runtime
        run: ./pipeline/scripts/Invoke-VoicePair.ps1 -Mode Prepare -ExpectedPipelineSha $env:EXPECTED_PIPELINE_SHA
      - name: Execute main once, then approval once only after qualified cleanup
        timeout-minutes: 32
        run: ./pipeline/scripts/Invoke-VoicePair.ps1 -Mode Run -ExpectedPipelineSha $env:EXPECTED_PIPELINE_SHA
      - name: Remove privately retained data only after owned lifetime completion
        if: always()
        run: ./pipeline/scripts/Invoke-VoicePair.ps1 -Mode Cleanup -ExpectedPipelineSha $env:EXPECTED_PIPELINE_SHA
      - name: Upload only strict curated operational results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-voice-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pipeline/TestResults/FocusedVoice/manifest.json
            pipeline/TestResults/FocusedVoice/main.invocation.json
            pipeline/TestResults/FocusedVoice/approval.invocation.json
            pipeline/TestResults/FocusedVoice/main.json
            pipeline/TestResults/FocusedVoice/approval.json
            pipeline/TestResults/FocusedVoice/main.sanitized.trx
            pipeline/TestResults/FocusedVoice/approval.sanitized.trx
            pipeline/TestResults/FocusedVoice/summary.json
            pipeline/TestResults/FocusedVoice/incomplete.json
          if-no-files-found: error
          retention-days: 7
