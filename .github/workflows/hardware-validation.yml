name: Windows hardware validation (temporary SKU inventory overlay)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-character workflow/helper commit (must match selected ref)
        required: true
        type: string

permissions:
  contents: read

# Temporary branch overlay of existing workflow ID 408676726, not a default-branch change.
# Parent reserves all three managed hosts before the single dispatch.
concurrency:
  group: windows-hardware-validation
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'openclaw/openclaw-windows-node'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: rtx-1
            architecture: arm64
            hardware: rtx-n1x-6144
          - host: rtx-2
            architecture: arm64
            hardware: rtx-n1x-5120
          - host: azure-mxc-1
            architecture: x64
            hardware: azure
    runs-on: [openclaw-managed, windows, '${{ matrix.architecture }}', '${{ matrix.hardware }}']
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    env:
      INVENTORY_CHECKOUT: .host-inventory-${{ github.run_id }}-${{ github.run_attempt }}
      INVENTORY_SOURCE_SHA: ${{ inputs.source_sha }}
      INVENTORY_WORKFLOW_SHA: ${{ github.sha }}
      INVENTORY_HOST: ${{ matrix.host }}
      INVENTORY_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Require immutable reviewed source
        run: |
          if ($env:INVENTORY_SOURCE_SHA -cnotmatch '\A[a-f0-9]{40}\z' -or
              $env:INVENTORY_SOURCE_SHA -cne $env:INVENTORY_WORKFLOW_SHA) {
            Write-Output '{"outcome":"source-rejected"}'
            exit 1
          }
      - id: inventory_checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          clean: false
          path: ${{ env.INVENTORY_CHECKOUT }}
      - name: Check pure parsing and privacy controls
        run: '& "$env:INVENTORY_CHECKOUT/scripts/Get-ManagedHostInventory.ps1" -SelfTest'
      - name: Read SKU and session metadata without executing WSL
        run: |
          & "$env:INVENTORY_CHECKOUT/scripts/Get-ManagedHostInventory.ps1" -SourceRevision $env:INVENTORY_SOURCE_SHA -HostSelector $env:INVENTORY_HOST -ExpectedArchitecture $env:INVENTORY_ARCHITECTURE
      - name: Remove only this invocation checkout
        if: always() && steps.inventory_checkout.outcome != 'skipped'
        run: |
          try {
            if ($env:INVENTORY_CHECKOUT -cnotmatch '\A\.host-inventory-[0-9]+-[0-9]+\z') { throw 'invalid-checkout' }
            $path = Join-Path $env:GITHUB_WORKSPACE $env:INVENTORY_CHECKOUT
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            }
            Write-Output '{"checkoutCleanup":"complete"}'
          } catch {
            Write-Output '{"checkoutCleanup":"failed"}'
            exit 1
          }
