name: Inbox capture preparation (no capture)
on:
  push:
    branches: [validation/inbox-stack-ab3cbe7b-20261108]
    paths:
      - .github/workflows/inbox-capture-preparation.yml
      - scripts/pr-ci-capture-preparation/**
      - scripts/pr-ci-observe-only/**
permissions:
  contents: read
concurrency:
  group: inbox-pr-observe-only-ab3cbe7b
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'openclaw/openclaw-windows-node'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed pipeline
        uses: actions/checkout@v7
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout exact failed product
        uses: actions/checkout@v7
        with:
          ref: e56258fd0a835969b417f8d0236baf86760e3139
          path: product
          fetch-depth: 0
          persist-credentials: false
      # No SDK/toolchain installer. The private entrypoint requires the preinstalled
      # source-selected 10.0.403 SDK and fails closed if it is unavailable/different.
      - name: Run preserved and new portable controls
        run: |
          python pipeline/scripts/pr-ci-observe-only/test_validation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pipeline/scripts/pr-ci-capture-preparation/test_preparation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pipeline/scripts/pr-ci-capture-preparation/test_procdump_help.py
          exit $LASTEXITCODE
      - name: Prepare tools and prove three barrier cases
        id: prepare
        timeout-minutes: 35
        run: |
          ./pipeline/scripts/pr-ci-capture-preparation/Invoke-CapturePreparation.ps1 -ProductRoot "$env:GITHUB_WORKSPACE/product" -PipelineRoot "$env:GITHUB_WORKSPACE/pipeline"
          exit $LASTEXITCODE
      - name: Join and clean private invocation
        if: always()
        run: |
          ./pipeline/scripts/pr-ci-capture-preparation/Invoke-CapturePreparation.ps1 -ProductRoot "$env:GITHUB_WORKSPACE/product" -PipelineRoot "$env:GITHUB_WORKSPACE/pipeline" -CleanupOnly
          exit $LASTEXITCODE
      - name: Validate only public receipt
        if: always()
        id: safe
        run: |
          python pipeline/scripts/pr-ci-capture-preparation/validate_preparation.py --check preparation-safe/safe-report.json
          exit $LASTEXITCODE
      - name: Upload only validated operational receipt
        if: always() && steps.safe.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: inbox-capture-preparation
          path: preparation-safe/safe-report.json
          if-no-files-found: error
          retention-days: 7
