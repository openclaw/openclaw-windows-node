name: Build OpenClaw Gateway MSIX

on:
  pull_request:
    paths:
      - .github/workflows/gateway-msix.yml
      - packaging/gateway-msix/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/gateway-msix.yml
      - packaging/gateway-msix/**
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: openclaw/openclaw tag, branch, or commit to package
        required: true
        default: d2825c70a5168c19e98ec75babf27476a3c15669
        type: string
      sign_packages:
        description: Sign packages with the protected OpenClaw release identity
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 11.15.1
  OPENCLAW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.openclaw_ref || 'd2825c70a5168c19e98ec75babf27476a3c15669' }}
  PACKAGING_ROOT: packaging/gateway-msix

jobs:
  test-host:
    name: Test Gateway MSIX host
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packaging/gateway-msix/Directory.Packages.props

      - name: Restore
        run: dotnet restore .\packaging\gateway-msix\OpenClaw.Gateway.MSIX.slnx

      - name: Test
        run: >
          dotnet test .\packaging\gateway-msix\OpenClaw.Gateway.MSIX.slnx
          --configuration Release
          --no-restore

  build-package:
    name: Build OpenClaw npm package
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out OpenClaw source
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ env.OPENCLAW_REF }}
          path: openclaw-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        working-directory: openclaw-source
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        working-directory: openclaw-source
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: |
          pnpm build
          pnpm ui:build

      - name: Pack npm package
        id: source
        working-directory: openclaw-source
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/openclaw-package"
          mkdir -p "${artifact_dir}"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --skip-build \
            --pnpm-pack \
            --output-dir "${artifact_dir}" \
            --output-name openclaw.tgz

          source_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

          cat > "${artifact_dir}/source.json" <<EOF
          {
            "repository": "https://github.com/openclaw/openclaw",
            "requestedRef": "${OPENCLAW_REF}",
            "resolvedCommit": "${source_sha}",
            "packageVersion": "${package_version}"
          }
          EOF

      - name: Upload intermediate package
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}/openclaw-package/
          if-no-files-found: error
          retention-days: 7

  build-payload:
    name: Build ${{ matrix.architecture }} gateway payload
    needs: build-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download intermediate package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}\openclaw-package

      - name: Stage and archive payload
        shell: pwsh
        run: |
          .\packaging\gateway-msix\scripts\Build-Payload.ps1 `
            -PackageDirectory '${{ runner.temp }}\openclaw-package' `
            -Architecture '${{ matrix.architecture }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-payload'

      - name: Upload payload
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload\
          if-no-files-found: error
          retention-days: 7

  build-msix:
    name: Build unsigned ${{ matrix.architecture }} Gateway MSIX
    needs:
      - test-host
      - build-payload
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packaging/gateway-msix/Directory.Packages.props

      - name: Download payload
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload

      - name: Restore NativeAOT and MSIX dependencies
        shell: pwsh
        run: |
          dotnet restore `
            .\packaging\gateway-msix\src\OpenClaw.Gateway.MSIXHost\OpenClaw.Gateway.MSIXHost.csproj `
            --runtime 'win-${{ matrix.architecture }}' `
            -p:PublishAot=true `
            -p:IncludePackagingContent=true `
            -p:Platform='${{ matrix.architecture }}'

      - name: Compose unsigned MSIX
        shell: pwsh
        run: |
          $buildComponent = [int64]::Parse('${{ github.run_number }}') % 65536
          $attemptComponent = [int64]::Parse('${{ github.run_attempt }}') % 65536
          $packageVersion = "0.1.$buildComponent.$attemptComponent"

          .\packaging\gateway-msix\scripts\Build-MSIX.ps1 `
            -PayloadDirectory '${{ runner.temp }}\openclaw-payload' `
            -Architecture '${{ matrix.architecture }}' `
            -NodeVersion '${{ env.NODE_VERSION }}' `
            -PackageVersion $packageVersion `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-msix'

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-unsigned-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}\openclaw-msix\OpenClawGateway-${{ matrix.architecture }}.msix
            ${{ runner.temp }}\openclaw-msix\msix-metadata.json
          if-no-files-found: error
          retention-days: 7

  sign-msix:
    name: Sign Gateway MSIX packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_packages }}
    needs: build-msix
    runs-on: windows-latest
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSIX packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files-folder: artifacts
          files-folder-filter: msix
          files-folder-depth: 2
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and refresh metadata
        shell: pwsh
        run: |
          $expectedSubject = 'CN=OpenClaw Foundation, O=OpenClaw Foundation, L=Mill Valley, S=California, C=US'
          foreach ($architecture in @('x64', 'arm64')) {
            $directory = Join-Path 'artifacts' $architecture
            $msix = Get-ChildItem -LiteralPath $directory -Filter '*.msix' -File
            if (@($msix).Count -ne 1) {
              throw "Expected one signed MSIX in $directory."
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $msix.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($msix.Name) signature status was $($signature.Status)."
            }
            if (-not [string]::Equals(
              $signature.SignerCertificate.Subject,
              $expectedSubject,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "$($msix.Name) signer was unexpected: $($signature.SignerCertificate.Subject)"
            }

            $metadataPath = Join-Path $directory 'msix-metadata.json'
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            $metadata.sha256 = (
              Get-FileHash -LiteralPath $msix.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $metadata.signed = $true
            $metadata | ConvertTo-Json |
              Set-Content -LiteralPath $metadataPath -Encoding utf8
          }

      - name: Upload signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-x64
          path: artifacts\x64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-arm64
          path: artifacts\arm64\
          if-no-files-found: error
          retention-days: 7
