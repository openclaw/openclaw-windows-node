name: Browser native composed proof

on:
  push:
    branches: [openclaw/automatic-chrome-extension-pairing]
    paths:
      - .github/workflows/browser-native-composed-proof.yml
      - scripts/Test-BrowserNativeComposition.mjs
      - scripts/Initialize-BrowserNativeComposition.ps1
      - scripts/BrowserNativePathAudit.cs

permissions:
  contents: read
  actions: read

jobs:
  composed-native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: producer
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: 57f78c49d47f445b85d4859f038e8447e08983ba
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.0'
          run_install: false
      - name: Verify immutable producer artifact and successful source run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api repos/openclaw/openclaw-windows-node/actions/runs/35416240545 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne '6dddf3d2eabf3316d4dcc726109adab7fdccf7ea' -or $run.conclusion -cne 'success') { throw 'Producer run identity mismatch.' }
          $artifact = gh api repos/openclaw/openclaw-windows-node/actions/artifacts/10576101237 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.expired -or $artifact.name -cne 'openclaw-tray-win-x64' -or $artifact.workflow_run.id -ne 35416240545 -or $artifact.digest -cne 'sha256:9beb60bac258eaf752e27fad6a60ddfbfcc79df130cc65d5e7b09c86fe26a859') { throw 'Producer artifact identity mismatch.' }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: '10576101237'
          run-id: '35416240545'
          github-token: ${{ github.token }}
          path: artifact
          merge-multiple: true
      - name: Audit original runtime ACLs and create private exact installation
        shell: pwsh
        run: |
          if ((git -C producer rev-parse HEAD:src).Trim() -cne 'ea2e65d057b0efaea8dbddc229548a9f34843196') { throw 'Producer product source changed; artifact pin must be reviewed.' }
          ./producer/scripts/Initialize-BrowserNativeComposition.ps1 -Consumer "${{ github.workspace }}/consumer" -Receipt "${{ runner.temp }}/composed-path-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Private runtime preparation failed; see redacted path audit.' }
      - name: Build exact canonical runtime without changing its source
        working-directory: ${{ env.COMPOSED_PRIVATE_CORE }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne '57f78c49d47f445b85d4859f038e8447e08983ba') { throw 'Consumer revision mismatch.' }
          pnpm install --frozen-lockfile --store-dir "$env:COMPOSED_PRIVATE_ROOT/store" --package-import-method=copy
          if ($LASTEXITCODE -ne 0) { throw 'Pinned consumer dependency install failed.' }
          pnpm build:docker
          if ($LASTEXITCODE -ne 0) { throw 'Pinned consumer runtime build failed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Consumer tracked source changed during build.' }
      - name: Execute real management generation admission pairing and rejection chain
        shell: pwsh
        run: |
          & $env:COMPOSED_PRIVATE_NODE producer/scripts/Test-BrowserNativeComposition.mjs "${{ github.workspace }}/artifact" $env:COMPOSED_PRIVATE_CORE "${{ runner.temp }}/composed-native-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw 'Composed native proof failed; see redacted receipt.' }
      - name: Retain redacted terminal receipt only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-native-composed-receipt
          path: |
            ${{ runner.temp }}/composed-native-receipt.json
            ${{ runner.temp }}/composed-path-audit.json
          if-no-files-found: warn
          retention-days: 7
