name: Request Microsoft Store publication

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful release workflow run containing the authorized Store bundle
        type: string
        required: true
  workflow_run:
    workflows: [Build and Test, Promote alpha to stable]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: microsoft-store-publication-request
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'openclaw/openclaw-windows-node' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.MSSTORE_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Select eligible publication request
      id: source
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.run_id }}
      run: |
        . ./scripts/StorePublicationRequest.ps1
        $runId = Get-CompanionStoreRequestRunId -Repository $env:GITHUB_REPOSITORY `
          -Ref $env:GITHUB_REF -EventName $env:GITHUB_EVENT_NAME `
          -RunId $env:SOURCE_RUN_ID -EventPath $env:GITHUB_EVENT_PATH
        if ($null -eq $runId) {
          'This completed workflow is not a stable-release publication request.' >> $env:GITHUB_STEP_SUMMARY
          exit 0
        }
        "run_id=$runId" >> $env:GITHUB_OUTPUT

    - name: Mint central request token
      if: steps.source.outputs.run_id != ''
      id: request-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: 2729701
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: openclaw
        repositories: releases
        permission-actions: write

    - name: Request release-manager-approved publication
      if: steps.source.outputs.run_id != ''
      shell: pwsh
      env:
        GH_TOKEN: ${{ steps.request-token.outputs.token }}
        SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
      run: |
        . ./scripts/StorePublicationRequest.ps1
        Request-CompanionStorePublication -RunId $env:SOURCE_RUN_ID
        @(
          '## Central Store publication requested'
          "Source: https://github.com/openclaw/openclaw-windows-node/actions/runs/$env:SOURCE_RUN_ID"
          'Publisher: https://github.com/openclaw/releases/actions/workflows/windows-store-publish.yml'
          'This confirms request acceptance only. Central provenance checks, release-manager approval, Store commit, and certification remain separate.'
        ) >> $env:GITHUB_STEP_SUMMARY
