name: Inbox PR observe-only preflight
# Temporary branch only. Publication and this one non-memory run remain parent-owned.
on:
  push:
    branches: [validation/inbox-stack-ab3cbe7b-20261108]
    paths:
      - .github/workflows/inbox-pr-observe-only.yml
      - scripts/pr-ci-observe-only/**
permissions:
  contents: read
concurrency:
  group: inbox-pr-observe-only-ab3cbe7b
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'openclaw/openclaw-windows-node'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      # Default checkout is the triggering immutable commit; the helper verifies it against GITHUB_SHA.
      - name: Checkout reviewed pipeline
        uses: actions/checkout@v7
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout exact failed product
        uses: actions/checkout@v7
        with:
          ref: 3bc3c0ccc71939fb2b760569bf438960e95767a7
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup source-compatible .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # No cache is restored/saved. Raw results and private scratch stay in RUNNER_TEMP.
      - name: Verify pure receipt controls
        run: |
          python pipeline/scripts/pr-ci-observe-only/test_validation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe one framework-bound host
        id: probe
        timeout-minutes: 35
        run: |
          ./pipeline/scripts/pr-ci-observe-only/Invoke-ObserveOnly.ps1 -ProductRoot "$env:GITHUB_WORKSPACE/product" -PipelineRoot "$env:GITHUB_WORKSPACE/pipeline"
          exit $LASTEXITCODE
      - name: Join and clean owned private scratch
        if: always()
        id: cleanup
        run: |
          ./pipeline/scripts/pr-ci-observe-only/Invoke-ObserveOnly.ps1 -ProductRoot "$env:GITHUB_WORKSPACE/product" -PipelineRoot "$env:GITHUB_WORKSPACE/pipeline" -CleanupOnly
          exit $LASTEXITCODE
      - name: Validate exact public file before upload
        if: always()
        id: safe
        run: |
          python pipeline/scripts/pr-ci-observe-only/validate_report.py --check observe-safe/safe-report.json
          exit $LASTEXITCODE
      - name: Upload only validated operational receipt
        if: always() && steps.safe.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: inbox-observe-only
          path: observe-safe/safe-report.json
          if-no-files-found: error
          retention-days: 7
