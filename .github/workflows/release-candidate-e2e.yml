name: Windows node release-candidate E2E

on:
  workflow_call:
    inputs:
      candidate_artifact_name:
        description: Name of the caller-run artifact containing openclaw-current.tgz and package-candidate.json.
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of openclaw-current.tgz from the caller's package metadata.
        required: true
        type: string
      candidate_version:
        description: Version expected from the candidate tarball.
        required: true
        type: string
      windows_node_release_tag:
        description: Immutable Windows-node GitHub Release tag whose app artifact will be tested.
        required: true
        type: string
      windows_node_release_sha:
        description: Immutable commit selected by the declared Windows-node release tag.
        required: true
        type: string
      allow_protocol_mismatch:
        description: Accept only an explicit PROTOCOL_MISMATCH result from this released app.
        required: false
        default: false
        type: boolean
      windows_node_sha:
        description: Immutable Windows node revision to test.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  setup-connect:
    name: Setup, connect, and invoke candidate gateway
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Validate immutable Windows node revision
        shell: pwsh
        run: |
          if ("${{ inputs.windows_node_sha }}" -notmatch '^[0-9a-f]{40}$') {
            throw "windows_node_sha must be a full lowercase Git SHA."
          }
          if ("${{ inputs.candidate_sha256 }}" -notmatch '^[0-9a-f]{64}$') {
            throw "candidate_sha256 must be a lowercase SHA-256."
          }
          if ("${{ inputs.windows_node_release_sha }}" -notmatch '^[0-9a-f]{40}$') {
            throw "windows_node_release_sha must be a full lowercase Git SHA."
          }
          if ("${{ inputs.windows_node_release_tag }}" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?$') {
            throw "windows_node_release_tag must be an immutable version tag."
          }

      - name: Check out Windows node
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw-windows-node
          ref: ${{ inputs.windows_node_sha }}
          persist-credentials: false

      - name: Download exact OpenClaw candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: ${{ runner.temp }}\openclaw-candidate

      - name: Verify candidate identity
        id: candidate
        shell: pwsh
        run: |
          $candidateDir = Join-Path $env:RUNNER_TEMP "openclaw-candidate"
          $tarball = Join-Path $candidateDir "openclaw-current.tgz"
          $metadataPath = Join-Path $candidateDir "package-candidate.json"
          if (-not (Test-Path -LiteralPath $tarball) -or -not (Test-Path -LiteralPath $metadataPath)) {
            throw "Candidate artifact must contain openclaw-current.tgz and package-candidate.json."
          }

          $actualHash = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ inputs.candidate_sha256 }}") {
            throw "Candidate tarball SHA-256 mismatch: expected ${{ inputs.candidate_sha256 }}, got $actualHash."
          }

          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.sha256 -ne "${{ inputs.candidate_sha256 }}" -or $metadata.version -ne "${{ inputs.candidate_version }}") {
            throw "Candidate metadata does not match the caller's declared SHA-256 and version."
          }

          "tarball=$tarball" >> $env:GITHUB_OUTPUT

      - name: Download and verify official Windows-node release artifact
        id: windows_node_artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.windows_node_release_tag }}"
          $release = gh api "repos/openclaw/openclaw-windows-node/releases/tags/$releaseTag" | ConvertFrom-Json
          if ($release.tag_name -ne $releaseTag -or $release.draft) {
            throw "Windows-node release tag must resolve to a published release: $releaseTag"
          }

          $tagRef = gh api "repos/openclaw/openclaw-windows-node/git/ref/tags/$releaseTag" | ConvertFrom-Json
          $releaseSha = $tagRef.object.sha
          if ($tagRef.object.type -eq "tag") {
            $releaseSha = (gh api "repos/openclaw/openclaw-windows-node/git/tags/$releaseSha" | ConvertFrom-Json).object.sha
          }
          if ($releaseSha -ne "${{ inputs.windows_node_release_sha }}") {
            throw "Windows-node release tag revision mismatch: expected ${{ inputs.windows_node_release_sha }}, got $releaseSha."
          }

          $x64Assets = @($release.assets | Where-Object {
            $_.state -eq "uploaded" -and
            $_.name -match '^OpenClawTray-.*-win-x64\\.zip$|^OpenClaw\\.Tray\\.WinUI_.*_x64\\.msix$' -and
            $_.digest -match '^sha256:[a-f0-9]{64}$'
          })
          $zipAssets = @($x64Assets | Where-Object { $_.name.EndsWith(".zip") })
          $msixAssets = @($x64Assets | Where-Object { $_.name.EndsWith(".msix") })
          $asset = if ($zipAssets.Count -eq 1) {
            $zipAssets[0]
          } elseif ($zipAssets.Count -eq 0 -and $msixAssets.Count -eq 1) {
            $msixAssets[0]
          } else {
            throw "Windows-node release must expose exactly one canonical hashed x64 ZIP or MSIX asset."
          }

          $assetDir = Join-Path $env:RUNNER_TEMP "windows-node-release"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          gh release download $releaseTag --repo openclaw/openclaw-windows-node --pattern $asset.name --dir $assetDir
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download official Windows-node release asset: $($asset.name)"
          }
          $assetPath = Join-Path $assetDir $asset.name
          if (-not (Test-Path -LiteralPath $assetPath)) {
            throw "Official Windows-node release download did not produce $($asset.name)."
          }

          $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = $asset.digest -replace '^sha256:', ''
          if ($actualHash -ne $expectedHash) {
            throw "Official Windows-node release asset SHA-256 mismatch: expected $expectedHash, got $actualHash."
          }

          $extension = [IO.Path]::GetExtension($assetPath)
          if ($extension -notin ".zip", ".msix") {
            throw "Windows-node release asset must be a .zip or .msix archive, got '$extension'."
          }

          # MSIX is a ZIP container but Expand-Archive requires a .zip filename.
          # Copy the verified bytes so both published Windows formats follow one path.
          $archivePath = Join-Path $assetDir "release.zip"
          Copy-Item -LiteralPath $assetPath -Destination $archivePath
          $extractDir = Join-Path $assetDir "expanded"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir -Force
          $trayExecutables = @(Get-ChildItem -LiteralPath $extractDir -Recurse -File -Filter "OpenClaw.Tray.WinUI.exe")
          if ($trayExecutables.Count -ne 1) {
            throw "Expected exactly one OpenClaw.Tray.WinUI.exe in Windows-node release asset; found $($trayExecutables.Count)."
          }

          "tray_exe=$($trayExecutables[0].FullName)" >> $env:GITHUB_OUTPUT
          "### Windows-node artifact under test" >> $env:GITHUB_STEP_SUMMARY
          "- Release: `$releaseTag` at `$releaseSha`" >> $env:GITHUB_STEP_SUMMARY
          "- Asset: `$($asset.name)`" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: `$actualHash`" >> $env:GITHUB_STEP_SUMMARY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and build E2E surface
        shell: pwsh
        run: |
          dotnet restore
          dotnet build src/OpenClaw.Shared -c Debug --no-restore
          dotnet build src/OpenClaw.SetupEngine -c Debug --no-restore
          dotnet build src/OpenClaw.Tray.WinUI -c Debug -r win-x64 --no-restore
          dotnet build tests/OpenClaw.E2ETests -c Debug -r win-x64 --no-restore

      - name: Run hosted candidate setup and node E2E
        shell: pwsh
        env:
          OPENCLAW_RUN_E2E: 1
          OPENCLAW_E2E_GATEWAY_PACKAGE_TGZ: ${{ steps.candidate.outputs.tarball }}
          OPENCLAW_E2E_GATEWAY_EXPECTED_VERSION: ${{ inputs.candidate_version }}
          OPENCLAW_E2E_TRAY_EXE: ${{ steps.windows_node_artifact.outputs.tray_exe }}
          OPENCLAW_E2E_PROTOCOL_MISMATCH_RESULT: ${{ runner.temp }}\\openclaw-e2e-protocol-mismatch.json
        run: |
          # GitHub-hosted Windows cannot exercise MXC/AppContainer containment.
          # MXC release proof belongs on an MXC-capable self-hosted runner and must reject skips.
          dotnet test tests/OpenClaw.E2ETests `
            --no-build `
            -c Debug `
            -r win-x64 `
            --verbosity normal `
            --results-directory TestResults/ReleaseCandidateE2E `
            --logger "trx;LogFileName=OpenClaw.E2ETests.release-candidate.trx" `
            --logger "console;verbosity=detailed" `
            --filter "FullyQualifiedName~OpenClaw.E2ETests.Setup.SetupAndConnectTests"
          if ($LASTEXITCODE -ne 0) {
            if ("${{ inputs.allow_protocol_mismatch }}" -ne "true") {
              exit $LASTEXITCODE
            }

            $resultPath = Join-Path $env:RUNNER_TEMP "openclaw-e2e-protocol-mismatch.json"
            if (-not (Test-Path -LiteralPath $resultPath)) {
              throw "Windows-node E2E failed without a structured protocol-mismatch result."
            }
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            if ($result.schema_version -ne 1 -or $result.outcome -ne "protocol_mismatch" -or $result.phase -ne "fixture_initialization") {
              throw "Windows-node E2E failed with an invalid protocol-mismatch result."
            }

            $trxFiles = @(Get-ChildItem TestResults/ReleaseCandidateE2E -File -Filter "*.trx" -ErrorAction SilentlyContinue)
            if ($trxFiles.Count -ne 1) {
              throw "Windows-node E2E must emit exactly one TRX result before protocol mismatch can be accepted."
            }
            [xml]$trx = Get-Content -LiteralPath $trxFiles[0].FullName -Raw
            $outcomes = @($trx.TestRun.Results.UnitTestResult | ForEach-Object outcome)
            if ($outcomes.Count -eq 0 -or @($outcomes | Where-Object { $_ -ne "Failed" }).Count -ne 0) {
              throw "Windows-node E2E had outcomes beyond the expected protocol mismatch; refusing to hide unrelated failures."
            }

            "### Expected Windows-node protocol incompatibility" >> $env:GITHUB_STEP_SUMMARY
            "The released Windows-node artifact emitted a structured protocol_mismatch result against this gateway candidate." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload candidate E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-node-release-candidate-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/ReleaseCandidateE2E/
            TestResults/E2E/
          if-no-files-found: warn
