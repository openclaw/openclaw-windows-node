name: Main Failure Watch

# When "Build and Test" fails on a push to main, report each failed test, the pull request that last
# changed it and that pull request's author to one tracking issue. It never reruns or reverts.
on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]

permissions: {}

# No concurrency group: GitHub keeps only one pending run per group and cancels the rest, which would
# drop reports. Parallel watches instead keep the oldest tracking issue (scripts/CiMainFailureWatch.ps1).

jobs:
  report:
    name: Report failed tests on main
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # The scripts are exercised on Windows (fast validation and local dry runs); keep the same platform.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Report failed tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: ./scripts/Watch-CiMainFailures.ps1 -Repository $env:REPOSITORY -RunId $env:RUN_ID -RunAttempt $env:RUN_ATTEMPT -HeadSha $env:HEAD_SHA
