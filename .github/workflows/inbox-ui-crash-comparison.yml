name: Inbox UI crash comparison

on:
  push:
    branches: [validation/inbox-stack-ab3cbe7b-20261108]

permissions:
  contents: read

concurrency:
  group: inbox-ui-crash-comparison-ab3cbe7b
  cancel-in-progress: false

jobs:
  compare:
    name: Ordinary UI - ${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: main
            source: b5c37e14476f1e2d2eda38deabf631b3dc8ffc0c
          - case: pr2060
            source: 3876d834ae5bbe2f75ef0a95b82120ddb55d6cfc
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      OPENCLAW_REPO_ROOT: ${{ github.workspace }}/source
      OPENCLAW_TRAY_DATA_DIR: ${{ github.workspace }}/profiles/${{ matrix.case }}/tray
      OPENCLAW_TRAY_APPDATA_DIR: ${{ github.workspace }}/profiles/${{ matrix.case }}/roaming
      OPENCLAW_TRAY_LOCALAPPDATA_DIR: ${{ github.workspace }}/profiles/${{ matrix.case }}/local
      OPENCLAW_CI_COLLECT_COVERAGE: 'false'
      OPENCLAW_RELEASE_SOURCE_SHA: ${{ matrix.source }}
      # The diagnostic pipeline SHA differs from the immutable product checkout.
      GitVersion_NoNormalizeEnabled: 'true'
      GitVersion_NoFetchEnabled: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate diagnostic helper and pinned checkout
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'One ordinary attempt per arm only; do not rerun this diagnostic job' }
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_SOURCE) { throw 'Unexpected product source' }
          if ((git status --porcelain --untracked-files=no)) { throw 'Product checkout is not clean' }
          foreach ($name in @('OPENCLAW_REPO_ROOT', 'OPENCLAW_TRAY_DATA_DIR', 'OPENCLAW_TRAY_APPDATA_DIR', 'OPENCLAW_TRAY_LOCALAPPDATA_DIR')) {
            $value = [IO.Path]::GetFullPath([Environment]::GetEnvironmentVariable($name))
            if ($value.Contains('/')) { throw 'Comparison roots must use native Windows separators' }
            [Environment]::SetEnvironmentVariable($name, $value)
            "$name=$value" >> $env:GITHUB_ENV
          }
          if ($env:OPENCLAW_REPO_ROOT -cne $PWD.Path) { throw 'Comparison repository root does not match the pinned checkout' }
          & ../pipeline/scripts/Invoke-InboxUiCrashComparison.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore and build the ordinary UI projects
        id: build
        run: |
          dotnet restore tests/OpenClaw.Tray.UITests -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/OpenClawTray.FunctionalUI.Tests -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OpenClaw.Tray.UITests -c Debug -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OpenClawTray.FunctionalUI.Tests -c Debug -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the source-selected WindowsAppRuntime
        id: runtime
        run: |
          [xml]$props = Get-Content ./Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/MicrosoftWindowsAppSDKVersion').InnerText.Trim()
          $channel = [regex]::Match($version, '^\d+\.\d+').Value
          if (-not $channel) { throw 'Invalid WindowsAppSDK version' }
          $installer = Join-Path $env:RUNNER_TEMP 'InboxComparison.WindowsAppRuntime.exe'
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/$channel/$version/windowsappruntimeinstall-x64.exe" -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure the existing CI desktop
        id: desktop
        run: ./scripts/Set-CiDesktopResolution.ps1
      - name: Run preceding Functional UI suite
        id: functional
        run: |
          ./scripts/Invoke-CiTest.ps1 -Project tests/OpenClawTray.FunctionalUI.Tests -ResultsDirectory ../proof/${{ matrix.case }}/functional -TrxFileName functional.trx -Runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run identical ordinary UI suite with non-memory diagnostics
        id: ordinary
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.runtime.outcome == 'success' && steps.desktop.outcome == 'success' && steps.functional.outcome == 'success' }}
        timeout-minutes: 15
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
          SOURCE_CASE: ${{ matrix.case }}
        run: |
          & ../pipeline/scripts/Invoke-InboxUiCrashComparison.ps1 -SourceRoot $PWD.Path -ExpectedSha $env:EXPECTED_SOURCE -Case $env:SOURCE_CASE -ReportRoot (Join-Path $env:GITHUB_WORKSPACE "proof/$env:SOURCE_CASE")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture bounded existing crash metadata
        if: ${{ always() && steps.ordinary.outcome != 'skipped' }}
        env:
          SOURCE_CASE: ${{ matrix.case }}
        run: |
          $manifest = Join-Path $env:GITHUB_WORKSPACE "proof/$env:SOURCE_CASE/manifest.json"
          if (-not (Test-Path $manifest)) { throw 'Diagnostic invocation manifest is missing' }
          $started = (Get-Content $manifest -Raw | ConvertFrom-Json).startedUtc
          ./scripts/Capture-CiTestHostCrashMetadata.ps1 -StartedUtc $started
      - name: Required repository build and Shared/Tray closeout
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in @('OpenClaw.Shared.Tests', 'OpenClaw.Tray.Tests')) {
            $project = "./tests/$suite/$suite.csproj"
            dotnet build $project -r win-x64 -p:AppendRuntimeIdentifierToOutputPath=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            . ./scripts/TestResultContract.ps1
            $invocation = New-TestInvocation -ResultsDirectory "../proof/${{ matrix.case }}/required" -TrxFileName "$suite.trx"
            dotnet test $project -r win-x64 -p:AppendRuntimeIdentifierToOutputPath=false --no-restore --results-directory $invocation.directory --logger "trx;LogFileName=$suite.trx"
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) { exit $testExit }
            $result = Read-TestResultContract -Path $invocation.report -StartedUtc $invocation.startedUtc -ExitCode $testExit -AllowSkipped
            Write-Host ("Required suite actual results: " + ($result | ConvertTo-Json -Compress))
          }
      - name: Sanitize result and sequence metadata
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
          SOURCE_CASE: ${{ matrix.case }}
        run: |
          & ../pipeline/scripts/Invoke-InboxUiCrashComparison.ps1 -SanitizeResults -SourceRoot $PWD.Path -ExpectedSha $env:EXPECTED_SOURCE -Case $env:SOURCE_CASE -ReportRoot (Join-Path $env:GITHUB_WORKSPACE "proof/$env:SOURCE_CASE")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload curated non-memory comparison receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inbox-ui-comparison-${{ matrix.case }}-${{ github.run_attempt }}
          path: |
            proof/${{ matrix.case }}/manifest.json
            proof/${{ matrix.case }}/exit-summary.json
            proof/${{ matrix.case }}/native-ui-metadata.json
            proof/${{ matrix.case }}/sanitized/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify immutable source and remove isolated profiles
        if: always()
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
          SOURCE_CASE: ${{ matrix.case }}
        run: |
          $rawTrace = Join-Path $env:RUNNER_TEMP "inbox-ui-diagnostics-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:SOURCE_CASE"
          if (Test-Path -LiteralPath $rawTrace) { Remove-Item -LiteralPath $rawTrace -Recurse -Force }
          $profile = Join-Path $env:GITHUB_WORKSPACE "profiles/$env:SOURCE_CASE"
          if (Test-Path -LiteralPath $profile) { Remove-Item -LiteralPath $profile -Recurse -Force }
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_SOURCE) { throw 'Product source changed during validation' }
          if ((git status --porcelain --untracked-files=no)) { throw 'Tracked product source changed during validation' }
